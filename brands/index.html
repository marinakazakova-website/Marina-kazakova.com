<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<!-- ============ NAVIGATION (links back to the homepage sections) ============ -->
<header class="site-nav" id="siteNav">
  <div class="container site-nav__inner">
    <a href="../index.html" class="site-nav__mark">Marina Kazakova</a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav__links" id="navLinks">
      <a class="site-nav__link" data-i18n-nav="profile" href="../index.html#profile">Profile</a>
      <a class="site-nav__link" data-i18n-nav="experience" href="../index.html#experience">Experience</a>
      <a class="site-nav__link" data-i18n-nav="method" href="../index.html#brand-ecosystem">Method</a>
      <a class="site-nav__link" data-i18n-nav="work" href="../index.html#work-together">Work With Me</a>
    </nav>

    <div class="site-nav__right">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button class="lang-switch__btn" data-lang="en">EN</button>
        <button class="lang-switch__btn" data-lang="ru">RU</button>
      </div>
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" aria-label="Music">
        <span class="music-toggle__icon" aria-hidden="true">♪</span>
      </button>
    </div>
  </div>
</header>

<main class="direction-page brands-page">

  <!-- Gradient-motion background — covers the intro + method nav zone
       only; sized in JS to that combined height, hard-cut before
       0 | Brand Audit. Same shared animation as homepage Block 2. -->
  <div class="brands-hero-bg" id="brandsHeroBg">
    <canvas aria-hidden="true"></canvas>
  </div>

  <!-- ============ 01 — BRANDS intro (shared Marina Kazakova design system) ============ -->
  <div class="container direction-intro">
    <div class="direction-intro__links">
      <a class="direction-intro__back" data-i18n-nav="backToExperience" href="../index.html#experience">← Experience</a>
      <div id="directionLinks"></div>
      <div class="client-strip" id="clientStrip"></div>
    </div>

    <div>
      <h1 class="direction-intro__title" id="directionTitle"></h1>
      <p class="direction-intro__tagline" id="directionTagline"></p>
      <div class="direction-intro__body" id="directionBody"></div>
      <p class="direction-intro__clients" id="directionClients" hidden></p>
    </div>
  </div>

  <div id="portfolioFlow" hidden></div>

  <!-- ============ Method system (custom to Brands) ============ -->
  <div class="brands">

    <!-- 02+03+04 — Method sequence: reveal animation + sticky anchor nav in one -->
    <div class="brands-method-sentinel" id="brandsMethodSentinel" aria-hidden="true"></div>
    <section class="brands-method" id="brandsMethod">
      <div class="container">
        <nav class="brands-method__nav" id="brandsMethodNav" aria-label="Brand method stages"></nav>
        <span class="brands-method__duration" id="brandsDuration"></span>
        <p class="brands-method__tagline" id="brandsTagline"></p>
      </div>
    </section>

    <!-- 05-14 — The five stages, all present at once, one under another -->
    <div class="brands-stages" id="brandsStages"></div>

  </div>

  <div class="direction-end">
    <a class="direction-end__back" data-i18n-nav="backToProjects" href="../index.html#experience">BACK TO PROJECTS PAGE</a>
  </div>

</main>

<script src="../data/content.js"></script>

<script src="../js/nav.js"></script>
