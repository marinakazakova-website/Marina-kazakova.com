<!doctype html>
<!-- G.A. Gemstone Zine — photographic cover template (1080×1350).
     Fixed: title (Didot Bold caps, centred, cap top y = 200) and website line
     (text top y = 1228). Per cover: photo, title text, website-line tint.
     Export: NODE_PATH=$(npm root -g) node tools/export.mjs -->
<html lang="en"><head><meta charset="utf-8"><title>Zine Covers</title>
<style>
  @font-face { font-family: "Didot Cover"; src: url(../brand/fonts_licensed/Didot-Bold.ttf); font-weight: 700; }   /* Apple Didot Bold (client-supplied) */
  body { margin: 0; background: #d9d6d0; display: flex; gap: 40px; padding: 40px; width: max-content; }
  .cover { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  .cover > img.photo { display: block; width: 1080px; height: 1350px; }
  .title { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
    top: 189px;                       /* → cap top at y = 200 */
    font-family: "Didot Cover"; font-weight: 700; font-size: 106px; line-height: 1;
    letter-spacing: .025em; text-indent: .025em;   /* indent balances the trailing space: optical centre */
    color: #102537; }
  .url { position: absolute; left: 375px; top: 1223px; width: 351px; height: 23px; }
</style></head>
<body>
<section class="cover" id="river">
  <img class="photo" src="build/river.jpg" alt="">
  <div class="title">GEMS OF ASIA</div>
  <img class="url" src="build/url_river.png" alt="www.gemanastation.com">
</section>
<section class="cover" id="mountain">
  <img class="photo" src="build/mountain.jpg" alt="">
  <div class="title">GEMS OF ASIA</div>
  <img class="url" src="build/url_mountain.png" alt="www.gemanastation.com">
</section>
<!-- Stories 1080×1920: title cap top y = 284 (post 200 × 1920/1350), website line text top 1744 -->
<section class="cover" id="river_story" style="height:1920px">
  <img class="photo" src="build/river_story.jpg" style="height:1920px" alt="">
  <div class="title" style="top:273px">GEMS OF ASIA</div>
  <img class="url" src="build/url_river_story.png" style="top:1739px" alt="www.gemanastation.com">
</section>
</body></html>
