<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gems in Every Color — Green</title>
<link rel="stylesheet" href="../founder/founder.css">
<style>
  @font-face { font-family: "Didot"; src: url(../brand/fonts_licensed/Didot-Regular.ttf); }
  body { margin: 0; }
