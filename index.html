<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina Kazakova — Strategic Brand Advisor & Brand Strategist</title>
<meta name="description" content="Marina Kazakova — Strategic Brand Advisor, Brand Strategist, Retail Experience Expert. 22+ years in brand development, customer experience and business transformation.">
<link rel="icon" type="image/png" href="assets/logos/bed-logo-black.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking: a slow/unreachable font request must never stall
     page scripts (a render-blocking <link rel="stylesheet"> here can delay
     DOMContentLoaded, and with it the opening animation, by several
     seconds if the request hangs). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"></noscript>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/experience.css">
<link rel="stylesheet" href="css/brand-ecosystem.css">
<link rel="stylesheet" href="css/work-together.css">
</head>
<body>

<!-- ============ NAVIGATION ============ -->
<header class="site-nav" id="siteNav">
  <div class="container site-nav__inner">
    <a href="#profile" class="site-nav__mark">Marina Kazakova</a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav__links" id="navLinks">
      <a class="site-nav__link" data-i18n-nav="profile" href="#profile">Profile</a>
      <a class="site-nav__link" data-i18n-nav="experience" href="#experience">Experience</a>
      <a class="site-nav__link" data-i18n-nav="method" href="#brand-ecosystem">Method</a>
      <a class="site-nav__link" data-i18n-nav="work" href="#work-together">Work With Me</a>
    </nav>

    <div class="site-nav__right">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button class="lang-switch__btn" data-lang="en">EN</button>
        <span class="lang-switch__sep">/</span>
        <button class="lang-switch__btn" data-lang="ru">RU</button>
      </div>
    </div>
  </div>
</header>

<!-- Opening title: morphs into the header mark above (js/opening-animation.js) -->
<div class="opening-title" id="openingTitle" aria-hidden="true">Marina Kazakova</div>

<main>

  <!-- ============ 01 PROFILE ============ -->
  <section id="profile" class="section-profile">
    <div class="profile-media">
      <img class="profile-media__img" src="assets/images/profile/marina-eyes-hero.jpg" alt="Marina Kazakova">
      <div class="profile-media__scrim" id="mediaScrim"></div>
    </div>

    <div class="container profile-reveal" id="profileReveal">
      <div class="profile-reveal__line" id="revealLine1"></div>
      <div class="profile-reveal__line" id="revealLine2"></div>
    </div>

    <div class="container profile-info">
      <div class="profile-info__text">
        <p class="profile-info__name" data-i18n="profile.name"></p>
        <p class="profile-info__roles" data-i18n="profile.roles"></p>
        <p class="profile-info__bold" data-i18n="profile.bioBold"></p>
        <p class="profile-info__body" data-i18n="profile.bioText"></p>
      </div>
      <a class="btn btn--dark profile-info__cta" data-i18n="profile.cta" href="https://t.me/marinakazakova_ru" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <!-- ============ 02 EXPERIENCE ============ -->
  <section id="experience" class="section-experience">

    <div class="experience-intro">
      <div class="container experience-intro__grid">
        <div>
          <p class="eyebrow experience-intro__eyebrow">Experience</p>
          <p class="experience-intro__lead" data-i18n="experienceIntro.lead"></p>
          <p class="experience-intro__formula" id="experienceFormula"></p>
          <blockquote class="experience-intro__quote">
            <span data-i18n="experienceIntro.quote"></span>
            <span class="experience-intro__quote-author" data-i18n="experienceIntro.quoteAuthor"></span>
          </blockquote>
        </div>

        <div class="experience-intro__portrait">
          <img src="assets/images/profile/marina-portrait-experience.jpeg" alt="Marina Kazakova — strategic thinking, brand building, creative direction, experience growth">
          <a class="btn btn--dark experience-intro__cta" data-i18n="experienceIntro.cta" href="https://t.me/marinakazakova_ru" target="_blank" rel="noopener"></a>
        </div>
      </div>

      <img class="experience-intro__mark" src="assets/logos/bed-logo-black.png" alt="Brand Ecosystem Design mark">
    </div>

    <div class="container experience-typo-nav" id="experienceTypoNav" role="tablist" aria-label="Experience directions"></div>

    <div class="experience-panel-wrap">
      <div class="experience-panel-bg" id="experiencePanelBg">
        <div class="experience-panel-bg__image" id="experiencePanelBgImage"></div>
        <div class="container">
          <article class="experience-panel-card" id="experiencePanelCard"></article>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 03 BRAND ECOSYSTEM DESIGN ============ -->
  <section id="brand-ecosystem" class="section-brand-ecosystem">
    <div class="triptych" id="triptych"></div>

    <div class="container brand-ecosystem__intro">
      <h2 class="eyebrow brand-ecosystem__title">BRAND ECOSYSTEM DESIGN&trade;</h2>
      <p class="brand-ecosystem__text" data-i18n="brandEcosystem.intro"></p>
    </div>

    <div class="container method">
      <div class="method__list" id="methodList" role="tablist" aria-label="Method steps"></div>
    </div>
  </section>

  <!-- ============ 04 WAYS TO WORK TOGETHER ============ -->
  <section id="work-together" class="section-work-together">
    <div class="work-bg">
      <img src="assets/images/backgrounds/work-together-bg.png" alt="" loading="lazy">
    </div>

    <div class="container">
      <div class="work-card">
        <p class="eyebrow work-card__eyebrow">Ways to Work Together</p>

        <div class="work-card__top">
          <div>
            <h2 class="work-card__name"><span>Marina</span><span>Kazakova</span></h2>
            <a class="btn btn--dark" data-i18n="workTogether.cta" href="https://t.me/marinakazakova_ru" target="_blank" rel="noopener"></a>
          </div>
          <div class="work-card__portrait">
            <img src="assets/images/profile/marina-portrait-bw.png" alt="Marina Kazakova">
          </div>
        </div>

        <hr class="work-card__divider">

        <div class="work-card__bottom" id="workCardBottom"></div>
      </div>
    </div>
  </section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="container site-footer__inner">
    <nav class="site-footer__links" id="footerLinks" aria-label="Contact"></nav>
    <p class="site-footer__copy" data-i18n="footer.copy"></p>
  </div>
</footer>

<script src="data/content.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/opening-animation.js"></script>
<script src="js/slider.js"></script>
<script src="js/experience.js"></script>
<script src="js/method.js"></script>
<script src="js/work-together.js"></script>
<script src="js/main.js"></script>
</body>
</html>
