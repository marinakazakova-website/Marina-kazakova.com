/* ==== css/tokens.css ==== */
/* ==========================================================================
   Design tokens — colors, type scale, spacing, motion.
   Values are a professional responsive interpretation of the Keynote/PDF
   mockup: the mockup fixes proportion & hierarchy, not literal px sizes.
   ========================================================================== */

:root {
  /* Color system */
  --color-black: #0b0b0c;
  --color-white: #ffffff;
  --color-offwhite: #f4f1ea;      /* warm off-white — overlay cards */
  --color-pale-grey: #d6d6d6;     /* inactive typographic nav / backdrop type */
  --color-pale-grey-soft: #ececec;
  --color-accent: #7a81ff;
  --color-accent-dim: #5b62d9;

  --color-text: var(--color-black);
  --color-text-inverse: var(--color-white);
  --color-border: rgba(11, 11, 12, 0.12);
  --color-border-inverse: rgba(255, 255, 255, 0.18);

  /* Fonts */
  --font-display: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;

  /* Fluid type scale — clamp(min, preferred, max) */
  --fs-display-huge: clamp(4rem, 1rem + 19.5vw, 18.5rem);  /* RETAIL/BUSINESS/BRANDS/FILMS poster nav */
  --fs-display-xl: clamp(2.4rem, 1.75rem + 5.3vw, 6.6rem); /* hero I SEE / oversized direction words */
  --fs-display-lg: clamp(2.5rem, 1.6rem + 5vw, 6.5rem);    /* MARINA KAZAKOVA, panel titles */
  --fs-display-md: clamp(1.9rem, 1.3rem + 2.4vw, 3.2rem);  /* method titles */
  --fs-heading: clamp(1.7rem, 1.2rem + 1.6vw, 2.4rem);     /* Brand Ecosystem Design statement */
  --fs-body-lg: clamp(1.1rem, 1rem + 0.5vw, 1.45rem);      /* quote, tagline, method description, work grid */
  --fs-body: clamp(0.95rem, 0.9rem + 0.2vw, 1.05rem);      /* paragraphs */
  --fs-small: clamp(0.78rem, 0.75rem + 0.1vw, 0.875rem);   /* nav links */
  --fs-label: clamp(0.7rem, 0.68rem + 0.1vw, 0.8rem);      /* EXPERIENCE / BRAND ECOSYSTEM DESIGN / WAYS TO WORK TOGETHER */
  --fs-micro: 0.7rem;                                       /* year stamps etc */

  --lh-tight: 1.02;
  --lh-snug: 1.15;
  --lh-normal: 1.45;
  --lh-relaxed: 1.6;

  --ls-tight: -0.01em;
  --ls-normal: 0;
  --ls-wide: 0.08em;
  --ls-wider: 0.14em;
  --ls-label: 0.06em;

  /* Spacing */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2.25rem;
  --space-5: 3.5rem;
  --space-6: 5.5rem;
  --space-7: 8rem;

  --container-max: 1440px;
  --container-pad: clamp(1.25rem, 1rem + 2vw, 4rem);

  --radius-card: clamp(18px, 1.4vw, 28px);
  --radius-btn: 4px;

  --nav-height: 76px;

  /* Motion */
  --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 180ms;
  --dur-base: 320ms;
  --dur-slow: 600ms;
}

/* ==== css/base.css ==== */
/* ========================================================================
   Reset + base element styles
   ======================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  margin: 0;
  background: var(--color-white);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img {
  max-width: 100%;
  display: block;
}

h1, h2, h3, h4, p, figure {
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.container {
  width: 100%;
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--container-pad);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Shared label system: EXPERIENCE / BRAND ECOSYSTEM DESIGN™ / WAYS TO WORK TOGETHER */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  padding: 0.9em 2.1em;
  font-family: var(--font-body);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  border-radius: var(--radius-btn);
  transition: background var(--dur-base) var(--ease-editorial), color var(--dur-base) var(--ease-editorial), transform var(--dur-fast) var(--ease-editorial);
  white-space: nowrap;
}

.btn:active { transform: scale(0.97); }

.btn--dark {
  background: var(--color-black);
  color: var(--color-white);
}
.btn--dark:hover { background: var(--color-accent); color: var(--color-black); }

/* ==== css/nav.css ==== */
/* ========================================================================
   Top navigation — minimal, editorial, sticky on desktop
   ======================================================================== */

.site-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
  height: var(--nav-height);
  display: flex;
  align-items: center;
  background: transparent;
  backdrop-filter: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-base) var(--ease-editorial), background var(--dur-base) var(--ease-editorial), backdrop-filter var(--dur-base) var(--ease-editorial);
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity var(--dur-slow) var(--ease-editorial), transform var(--dur-slow) var(--ease-editorial);
  pointer-events: none;
}

.site-nav.is-visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.site-nav.is-scrolled {
  background: rgba(244, 241, 234, 0.72);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom-color: var(--color-border);
}

.site-nav__inner {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: var(--space-3);
}

.site-nav__mark {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  flex-shrink: 0;
  margin-right: auto;
}

/* ---- Opening title: MARINA KAZAKOVA appears large and centered, then
   flies/shrinks into the header mark's exact position (see
   js/opening-animation.js). Same font/weight/tracking as .site-nav__mark
   throughout — only size and position animate, for a seamless morph. */
body.is-opening { overflow: hidden; }

.opening-title {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 900;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.8rem, 1.2rem + 3vw, 3.8rem);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  color: var(--color-black);
  white-space: nowrap;
  opacity: 0;
  transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--s, 1));
  transition: opacity 350ms ease;
}

.opening-title.is-visible { opacity: 1; }

.opening-title.is-flying {
  transition: opacity 350ms ease, transform 600ms var(--ease-editorial);
}

.opening-title.is-done {
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
}

.site-nav__links {
  display: flex;
  align-items: center;
  gap: clamp(1rem, 1.5vw, 2.25rem);
}

.site-nav__link {
  font-size: var(--fs-small);
  font-weight: 600;
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  color: var(--color-text);
  opacity: 0.62;
  position: relative;
  padding-block: 0.35em;
  transition: opacity var(--dur-fast) var(--ease-editorial);
}

.site-nav__link::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: 0;
  height: 1px;
  background: var(--color-accent);
  transition: right var(--dur-base) var(--ease-editorial);
}

.site-nav__link:hover,
.site-nav__link.is-active {
  opacity: 1;
}
.site-nav__link:hover::after,
.site-nav__link.is-active::after {
  right: 0;
}

.site-nav__right {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.lang-switch {
  display: flex;
  align-items: center;
  gap: 0.4em;
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: var(--ls-wide);
}

.lang-switch__btn {
  opacity: 0.4;
  transition: opacity var(--dur-fast) var(--ease-editorial);
}
.lang-switch__btn.is-active { opacity: 1; }
.lang-switch__btn:hover { opacity: 0.8; }

.lang-switch__sep {
  opacity: 0.3;
}

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  width: 26px;
}
.nav-toggle span {
  display: block;
  height: 2px;
  background: var(--color-black);
  transition: transform var(--dur-base) var(--ease-editorial), opacity var(--dur-base) var(--ease-editorial);
}

@media (max-width: 760px) {
  .site-nav__links {
    position: fixed;
    top: var(--nav-height);
    left: 0;
    right: 0;
    background: var(--color-offwhite);
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
    padding: var(--space-3) var(--container-pad) var(--space-4);
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-base) var(--ease-editorial), transform var(--dur-base) var(--ease-editorial);
    border-bottom: 1px solid var(--color-border);
  }
  .site-nav__links.is-open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .nav-toggle { display: flex; }
  .nav-toggle.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.is-open span:nth-child(2) { opacity: 0; }
  .nav-toggle.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
}

/* ==== css/profile.css ==== */
/* ========================================================================
   01 — PROFILE / first screen
   ======================================================================== */

.section-profile {
  position: relative;
}

/* Aspect ratio matches the client-supplied crop (1662x665) exactly, so
   object-fit: cover never trims it further — this is the crop as given. */
.profile-media {
  position: relative;
  width: 100%;
  aspect-ratio: 2.5 / 1;
  overflow: hidden;
  background: var(--color-black);
}

.profile-media__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  filter: grayscale(100%) contrast(1.05);
}

/* Delicate light scrim, visible only during the opening sequence so the
   centered MARINA KAZAKOVA title reads cleanly over the photo; fades out
   once the title has docked into the header. */
.profile-media__scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: rgba(244, 241, 234, 0.45);
  opacity: 1;
  transition: opacity 600ms var(--ease-editorial);
}
.profile-media__scrim.is-hidden { opacity: 0; }

/* Headline straddles the seam between the photo and the white profile zone:
   negative margin pulls line 1 back over the image, line 2 lands on white. */
.profile-reveal {
  position: relative;
  z-index: 2;
  margin-top: calc(-1 * var(--fs-display-xl) * var(--lh-tight));
}

.profile-reveal__line {
  font-size: var(--fs-display-xl);
  line-height: var(--lh-tight);
}

/* Mask reveal: the text itself never moves or fades — clip-path opens
   left to right, like a shutter, independent of whatever is behind it
   (photo or white). */
.profile-reveal__line-inner {
  display: inline-block;
  clip-path: inset(0 100% 0 0);
  transition: clip-path 550ms var(--ease-editorial);
}

.profile-reveal__line:nth-child(2) .profile-reveal__line-inner {
  transition-delay: 150ms;
}

.is-revealed .profile-reveal__line-inner {
  clip-path: inset(0 0 0 0);
}

.profile-reveal__word {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: var(--ls-tight);
  text-transform: uppercase;
  color: var(--color-black);
}

.profile-reveal__word.is-accent { color: var(--color-accent); }

.profile-info {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding-block: var(--space-4) var(--space-6);
}

/* Even, uniform row rhythm via flex gap rather than per-line margins —
   margins compound unevenly (fixed rem next to em-based values); gap
   guarantees identical spacing between every line. */
.profile-info__text {
  max-width: 64rem;
  display: flex;
  flex-direction: column;
  gap: 0.5em;
}

/* Per the client's mockup: all four lines share one font-size — hierarchy
   comes only from weight (bold on name + closing line, regular on the
   other two), not from size or emphasis-through-scale. */
.profile-info__name,
.profile-info__roles,
.profile-info__bold,
.profile-info__body {
  font-size: var(--fs-body-lg);
  line-height: var(--lh-snug);
}

.profile-info__name {
  font-family: var(--font-body);
  font-weight: 700;
}

.profile-info__roles {
  font-weight: 400;
  opacity: 0.7;
}

.profile-info__bold {
  font-weight: 400;
}

.profile-info__body {
  font-weight: 700;
}

.profile-info__cta { flex-shrink: 0; }

@media (max-width: 760px) {
  .profile-media { aspect-ratio: 4 / 3; max-height: none; }
  .profile-reveal { margin-top: calc(-1 * var(--fs-display-xl) * 0.4); }
  .profile-info { flex-direction: column; align-items: flex-start; }
}

/* ==== css/experience.css ==== */
/* ========================================================================
   02 — EXPERIENCE (intro, typographic nav, panels)
   ======================================================================== */

.section-experience {
  background: var(--color-white);
}

/* ---- Intro (purple) ---- */
.experience-intro {
  position: relative;
  background: var(--color-accent);
  color: var(--color-black);
  padding: var(--space-6) 0 var(--space-7);
}

.experience-intro__grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: var(--space-5);
  align-items: start;
}

.experience-intro__eyebrow {
  margin-bottom: var(--space-3);
}

.experience-intro__lead {
  font-size: var(--fs-heading);
  font-weight: 400;
  line-height: var(--lh-snug);
  margin-bottom: 0.2em;
}

.experience-intro__formula {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.8rem, 1.2rem + 2.6vw, 3.1rem);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-tight);
}

.experience-intro__quote {
  margin-top: var(--space-5);
  margin-left: auto;
  max-width: 30rem;
  font-size: var(--fs-body-lg);
  line-height: var(--lh-relaxed);
}

.experience-intro__quote-author {
  display: block;
  margin-top: var(--space-2);
  font-weight: 700;
  text-align: right;
}

.experience-intro__cta {
  position: absolute;
  right: var(--space-3);
  bottom: var(--space-3);
}

.experience-intro__portrait {
  position: relative;
  border-radius: var(--radius-card);
  overflow: hidden;
  aspect-ratio: 3 / 4;
  background: var(--color-black);
}

.experience-intro__portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}

.experience-intro__mark {
  position: absolute;
  left: var(--container-pad);
  bottom: var(--space-3);
  width: clamp(44px, 3.4vw, 58px);
  opacity: 0.9;
}

/* ---- Typographic nav (RETAIL / BUSINESS / BRANDS / FILMS) ---- */
.experience-typo-nav {
  padding-block: var(--space-5) var(--space-4);
}

.experience-typo-nav__item {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-display-huge);
  line-height: 0.9;
  letter-spacing: var(--ls-tight);
  text-transform: capitalize;
  color: var(--color-pale-grey);
  transition: color var(--dur-base) var(--ease-editorial);
}

.experience-typo-nav__item:hover,
.experience-typo-nav__item:focus-visible,
.experience-typo-nav__item.is-active {
  color: var(--color-black);
}

/* ---- Panel (background photo + light overlay card) ---- */
.experience-panel-wrap {
  position: relative;
  min-height: 640px;
}

.experience-panel-bg {
  position: relative;
  min-height: 640px;
  background: var(--color-black);
  overflow: hidden;
  display: flex;
  align-items: flex-start;
}

.experience-panel-bg__image {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: grayscale(100%) contrast(1.05) brightness(0.92);
  opacity: 0;
  transition: opacity var(--dur-slow) var(--ease-editorial);
}

.experience-panel-bg__image.is-ready { opacity: 1; }

.experience-panel-card {
  position: relative;
  z-index: 2;
  width: 100%;
  margin: clamp(1.5rem, 4vw, 4rem) auto;
  max-width: 1180px;
  background: var(--color-offwhite);
  border-radius: var(--radius-card);
  padding: clamp(1.5rem, 2.2vw, 3rem);
  box-shadow: 0 30px 70px rgba(0,0,0,0.28);
  opacity: 0;
  transform: translateY(14px);
  transition: opacity var(--dur-slow) var(--ease-editorial), transform var(--dur-slow) var(--ease-editorial);
}

.experience-panel-card.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.experience-panel-card__title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-display-md);
  line-height: var(--lh-snug);
  margin-bottom: var(--space-3);
}

.experience-panel-card__grid {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
  gap: var(--space-4);
  align-items: start;
}

/* Media column: slider or video slot */
.panel-media {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: calc(var(--radius-card) * 0.6);
  overflow: hidden;
  background: #e3e0d8;
}

.panel-slider {
  position: relative;
  width: 100%;
  height: 100%;
}

.panel-slider__track {
  position: relative;
  width: 100%;
  height: 100%;
}

.panel-slider__slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity var(--dur-slow) var(--ease-editorial);
}
.panel-slider__slide.is-active { opacity: 1; z-index: 1; }

.panel-slider__slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.panel-slider__arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: clamp(36px, 3vw, 46px);
  height: clamp(36px, 3vw, 46px);
  border-radius: 50%;
  background: var(--color-black);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  transition: background var(--dur-fast) var(--ease-editorial), transform var(--dur-fast) var(--ease-editorial);
}
.panel-slider__arrow:hover { background: var(--color-accent); }
.panel-slider__arrow:active { transform: translateY(-50%) scale(0.92); }
.panel-slider__arrow img { width: 38%; height: 38%; object-fit: contain; }
.panel-slider__arrow--next { right: 0.85em; }

.panel-media--single .panel-slider__arrow { display: none; }

.panel-media--empty {
  background: rgba(11, 11, 12, 0.045);
}

/* Video slot — intentionally clean/empty until a source is provided */
.panel-video-slot {
  width: 100%;
  height: 100%;
  position: relative;
}
.panel-video-slot iframe,
.panel-video-slot video {
  width: 100%;
  height: 100%;
  border: 0;

/* ==== css/brand-ecosystem.css ==== */
/* ========================================================================
   03 — BRAND ECOSYSTEM DESIGN (triptych + interactive Method)
   ======================================================================== */

.section-brand-ecosystem {
  background: var(--color-black);
  color: var(--color-white);
  padding-bottom: var(--space-6);
}

.triptych {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(10px, 1.2vw, 18px);
  width: 100%;
  background: var(--color-black);
  padding-inline: clamp(10px, 1.2vw, 18px);
}

.triptych img {
  width: 100%;
  aspect-ratio: 6 / 7;
  object-fit: cover;
  object-position: center top;
  display: block;
}

.brand-ecosystem__intro {
  padding-block: var(--space-6) var(--space-5);
}

.brand-ecosystem__title {
  color: var(--color-accent);
  text-align: center;
  margin-bottom: var(--space-3);
  display: block;
}

.brand-ecosystem__text {
  max-width: 56rem;
  margin-inline: auto;
  text-align: center;
  font-size: var(--fs-heading);
  font-weight: 400;
  line-height: var(--lh-normal);
  color: rgba(255,255,255,0.95);
}

/* ---- Interactive Method ---- */
.method {
  padding-top: var(--space-4);
}

.method__list {
  border-top: 1px solid var(--color-border-inverse);
}

.method__row {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
  gap: var(--space-4);
  align-items: center;
  padding-block: clamp(1.3rem, 1.8vw, 2rem);
  border-bottom: 1px solid var(--color-border-inverse);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.method__title-wrap {
  display: flex;
  align-items: baseline;
  gap: 0.5em;
}

.method__marker {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.3rem, 1rem + 1.2vw, 1.9rem);
  color: rgba(255,255,255,0.35);
  width: 0.7em;
  opacity: 1;
  transition: opacity var(--dur-base) var(--ease-editorial);
}

.method__row.is-active .method__marker { opacity: 0; }

.method__title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-display-md);
  color: var(--color-white);
  transition: color var(--dur-base) var(--ease-editorial);
}

.method__row.is-active .method__title,
.method__row:hover .method__title {
  color: var(--color-accent);
}

.method__desc {
  font-size: var(--fs-body-lg);
  line-height: var(--lh-relaxed);
  color: rgba(255,255,255,0.65);
  transition: color var(--dur-base) var(--ease-editorial), opacity var(--dur-base) var(--ease-editorial);
  opacity: 0.85;
}

.method__row.is-active .method__desc {
  color: var(--color-accent);
  opacity: 1;
}

.method__desc-inner {
  display: inline-block;
  animation: method-fade var(--dur-base) var(--ease-editorial);
}

@keyframes method-fade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 700px) {
  .triptych { grid-template-columns: 1fr; }
  .triptych img { height: 46vw; }
  .method__row { grid-template-columns: 1fr; gap: 0.5rem; }
}

<script>
/* ==== js/i18n.js ==== */
/**
 * Minimal i18n layer. Default language: English.
 * Switching language only swaps text — structure, images, layout and
 * animations never change (per spec).
 */
(function () {
  "use strict";

  var state = { lang: "en" };

  function renderInline(str) {
    if (!str) return "";
    return String(str).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  /** Resolve a "a.b.c" path against SITE_CONTENT, trying the lang-keyed
   *  sub-object first, then falling back to a language-independent value. */
  function t(path) {
    var parts = path.split(".");
    var obj = window.SITE_CONTENT;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!obj) return "";
      obj = obj[parts[i]];
    }
    if (!obj) return "";
    var last = parts[parts.length - 1];
    if (obj[state.lang] && obj[state.lang][last] !== undefined) {
      return obj[state.lang][last];
    }
    return obj[last] !== undefined ? obj[last] : "";
  }

  function tNav(key) {
    return window.SITE_CONTENT.nav[state.lang][key];
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", state.lang);

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });

    document.querySelectorAll("[data-i18n-nav]").forEach(function (el) {
      el.textContent = tNav(el.getAttribute("data-i18n-nav"));
    });

    document.querySelectorAll(".lang-switch__btn").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.getAttribute("data-lang") === state.lang);
    });
  }

  function setLang(lang) {
    if (lang !== "en" && lang !== "ru") return;
    if (lang === state.lang) return;
    state.lang = lang;
    applyStatic();
    document.dispatchEvent(new CustomEvent("mk:langchange", { detail: { lang: lang } }));
  }

  function init() {
    document.querySelectorAll(".lang-switch__btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLang(btn.getAttribute("data-lang"));
      });
    });
    applyStatic();
  }

  window.MK = window.MK || {};
  window.MK.i18n = {
    init: init,
    setLang: setLang,
    t: t,
    renderInline: renderInline,
    getLang: function () { return state.lang; }
  };
})();

</script>
<script>
/* ==== js/nav.js ==== */
/**
 * Sticky navigation: scroll shadow, offset smooth-scroll, mobile toggle,
 * active-section highlighting.
 */
(function () {
  "use strict";

  var nav, toggle, links, sections;

  function onScroll() {
    nav.classList.toggle("is-scrolled", window.scrollY > 12);
  }

  function closeMobile() {
    links.classList.remove("is-open");
    toggle.classList.remove("is-open");
    toggle.setAttribute("aria-expanded", "false");
  }

  function initSmoothScroll() {
    nav.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener("click", function (e) {
        var target = document.querySelector(a.getAttribute("href"));
        if (!target) return;
        e.preventDefault();
        var navHeight = nav.offsetHeight;
        var top = target.getBoundingClientRect().top + window.pageYOffset - (navHeight - 1);
        window.scrollTo({ top: top, behavior: "smooth" });
        closeMobile();
      });
    });
  }

  function initActiveHighlight() {
    if (!("IntersectionObserver" in window)) return;
    var linkMap = {};
    links.querySelectorAll("a").forEach(function (a) {
      linkMap[a.getAttribute("href").replace("#", "")] = a;
    });

    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          var link = linkMap[entry.target.id];
          if (!link) return;
          if (entry.isIntersecting) {
            links.querySelectorAll("a").forEach(function (a) { a.classList.remove("is-active"); });
            link.classList.add("is-active");
          }
        });
      },
      { rootMargin: "-45% 0px -50% 0px" }
    );

    sections.forEach(function (s) { observer.observe(s); });
  }

  function reveal() {
    nav.classList.add("is-visible");
  }

  function init() {
    nav = document.getElementById("siteNav");
    toggle = document.getElementById("navToggle");
    links = document.getElementById("navLinks");
    sections = document.querySelectorAll("main > section[id]");

    window.addEventListener("scroll", onScroll, { passive: true });

    toggle.addEventListener("click", function () {
      var isOpen = links.classList.toggle("is-open");
      toggle.classList.toggle("is-open", isOpen);
      toggle.setAttribute("aria-expanded", String(isOpen));
    });

    initSmoothScroll();
    initActiveHighlight();
  }

  window.MK = window.MK || {};
  window.MK.nav = { init: init, reveal: reveal };
})();

</script>
<script>
/* ==== js/opening-animation.js ==== */
/**
 * Opening sequence (runs on every full page load — not on language switch
 * or in-site navigation):
 *
 *   1. MARINA KAZAKOVA fades in, large, centered over the (scrimmed) hero photo.
 *   2. Short hold.
 *   3. It shrinks + flies into the header's top-left corner, landing exactly
 *      on the permanent nav mark — the scrim fades out at the same time.
 *   4. The real header (links, EN/RU) fades in; scroll unlocks.
 *   5. The "I SEE WHAT / IT CAN BECOME." headline mask-reveals, line by line.
 *
 * Total runtime ~2.7s. All timings below are in ms.
 */
(function () {
  "use strict";

  var TITLE_IN_DELAY = 100;
  var TITLE_IN_DUR = 350;
  var HOLD_DUR = 600;
  var FLY_DUR = 600;
  var HEADLINE_GAP = 350;

  function buildWord(word, accent) {
    var span = document.createElement("span");
    span.className = "profile-reveal__word" + (accent ? " is-accent" : "");
    span.textContent = word;
    return span;
  }

  function buildLine(container, words) {
    container.innerHTML = "";
    var inner = document.createElement("span");
    inner.className = "profile-reveal__line-inner";
    words.forEach(function (item, i) {
      if (i > 0) inner.appendChild(document.createTextNode(" "));
      inner.appendChild(buildWord(item.w, item.accent));
    });
    container.appendChild(inner);
  }

  function renderHeadline() {
    var lang = window.MK.i18n.getLang();
    var words = window.SITE_CONTENT.profile[lang].headlineWords;
    buildLine(document.getElementById("revealLine1"), words.slice(0, 3));
    buildLine(document.getElementById("revealLine2"), words.slice(3, 6));
  }

  function revealHeadline() {
    document.getElementById("profileReveal").classList.add("is-revealed");
  }

  /** Centers the opening title in the viewport, then — after the hold —
   *  flies/shrinks it to sit exactly over the real (still-invisible)
   *  header mark, and finally hands off to the permanent header. */
  function playTitle(onDocked) {
    var title = document.getElementById("openingTitle");
    var scrim = document.getElementById("mediaScrim");
    var navMark = document.querySelector(".site-nav__mark");

    if (!title || !navMark) { onDocked(); return; }

    var titleRect = title.getBoundingClientRect();
    var centerX = window.innerWidth / 2 - titleRect.width / 2;
    var centerY = window.innerHeight / 2 - titleRect.height / 2;

    title.style.setProperty("--tx", centerX + "px");
    title.style.setProperty("--ty", centerY + "px");
    title.style.setProperty("--s", "1");

    window.setTimeout(function () {
      requestAnimationFrame(function () {
        title.classList.add("is-visible");
      });
    }, TITLE_IN_DELAY);

    window.setTimeout(function () {
      var targetRect = navMark.getBoundingClientRect();
      var scale = targetRect.height / titleRect.height;
      var targetX = targetRect.left + targetRect.width / 2 - titleRect.width / 2;
      var targetY = targetRect.top + targetRect.height / 2 - titleRect.height / 2;

      title.classList.add("is-flying");
      title.style.setProperty("--tx", targetX + "px");
      title.style.setProperty("--ty", targetY + "px");
      title.style.setProperty("--s", String(scale));
      if (scrim) scrim.classList.add("is-hidden");

      window.setTimeout(function () {
        title.classList.add("is-done");
        window.MK.nav.reveal();
        document.body.classList.remove("is-opening");
        onDocked();
      }, FLY_DUR);
    }, TITLE_IN_DELAY + TITLE_IN_DUR + HOLD_DUR);
  }

  function play() {
    renderHeadline();
    document.body.classList.add("is-opening");

    playTitle(function () {
      window.setTimeout(revealHeadline, HEADLINE_GAP);
    });
  }

  document.addEventListener("mk:langchange", renderHeadline);

  window.MK = window.MK || {};
  window.MK.openingAnimation = { play: play };
})();

</script>
<script>
/* ==== js/slider.js ==== */
/**
 * Minimal, dependency-free image slider. Arrow-controlled only —
 * no dot pagination, no generic carousel chrome (per art direction).
 */
(function () {
  "use strict";

  var ARROW_ICON = "assets/icons/icon-arrow-right.png";

  function Slider(container, images) {
    this.container = container;
    this.images = images || [];
    this.index = 0;
    this.render();
  }

  Slider.prototype.render = function () {
    var self = this;
    this.container.innerHTML = "";
    this.container.classList.add("panel-slider");
    if (this.images.length <= 1) {
      this.container.parentElement.classList.add("panel-media--single");
    }

    var track = document.createElement("div");
    track.className = "panel-slider__track";

    this.slides = this.images.map(function (src, i) {
      var slide = document.createElement("div");
      slide.className = "panel-slider__slide" + (i === 0 ? " is-active" : "");
      var img = document.createElement("img");
      img.src = src;
      img.loading = i === 0 ? "eager" : "lazy";
      img.alt = "";
      slide.appendChild(img);
      track.appendChild(slide);
      return slide;
    });
    this.container.appendChild(track);

    if (this.images.length > 1) {
      var next = document.createElement("button");
      next.className = "panel-slider__arrow panel-slider__arrow--next";
      next.setAttribute("aria-label", "Next image");
      next.innerHTML = '<img src="' + ARROW_ICON + '" alt="">';
      next.addEventListener("click", function () { self.go(1); });

      this.container.appendChild(next);
    }
  };

  Slider.prototype.go = function (delta) {
    if (!this.slides || this.slides.length < 2) return;
    this.slides[this.index].classList.remove("is-active");
    this.index = (this.index + delta + this.slides.length) % this.slides.length;
    this.slides[this.index].classList.add("is-active");
  };

  window.MK = window.MK || {};
  window.MK.Slider = Slider;
})();

</script>

(function () {

  var directions = window.SITE_CONTENT.experienceDirections;
  var activeId = directions[0].id;
  var navEl, cardEl, bgEl, slider;
  var isFinePointer = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  var ICONS = {
    website: "assets/icons/icon-website.png",
    portfolio: "assets/icons/icon-download.png",
    collaboration: "assets/icons/icon-telegram.png"
  };

  function getDirection(id) {

  }

  function renderStaticIntroBits() {
    document.getElementById("experienceFormula").textContent = window.SITE_CONTENT.experienceIntro.formula;

  function renderTypoNav() {

      var btn = document.createElement("button");
      btn.className = "experience-typo-nav__item" + (d.id === activeId ? " is-active" : "");
      btn.textContent = d.navLabel;

      if (isFinePointer) {
        btn.addEventListener("mouseenter", function () { setActive(d.id); });

  function linkRow(kind, linkData) {
    var wrap = document.createElement("a");
    wrap.className = "panel-links__item";

    if (isDisabled) {
      wrap.classList.add("is-disabled");
      wrap.setAttribute("aria-disabled", "true");
      wrap.href = "javascript:void(0)";
    } else {
      wrap.href = linkData.href;
      var isDownload = kind === "portfolio";
      if (isDownload) {
        wrap.setAttribute("download", "");

  function buildMedia(direction) {
    var mediaWrap = document.createElement("div");

    if (direction.media.type === "slider") {

  /** Ready for a local mp4, a Vimeo id/url, or a YouTube id/url — wire the
   *  source later in data/content.js (experienceDirections -> films -> media.video). */
  function renderVideoInto(slot, video) {
    if (video.type === "mp4") {
      var v = document.createElement("video");
      v.src = video.src;
      v.controls = true;
      v.playsInline = true;
      slot.appendChild(v);
    } else if (video.type === "vimeo") {
      var f1 = document.createElement("iframe");
      f1.src = "https://player.vimeo.com/video/" + video.id;
      f1.setAttribute("allow", "autoplay; fullscreen; picture-in-picture");
      f1.setAttribute("allowfullscreen", "");
      slot.appendChild(f1);
    } else if (video.type === "youtube") {
      var f2 = document.createElement("iframe");
      f2.src = "https://www.youtube.com/embed/" + video.id;
      f2.setAttribute("allow", "autoplay; fullscreen; picture-in-picture");
      f2.setAttribute("allowfullscreen", "");
      slot.appendChild(f2);

  function buildCardContent(direction) {

    var wrap = document.createDocumentFragment();

    var title = document.createElement("h3");

    var grid = document.createElement("div");
    grid.className = "experience-panel-card__grid";

    grid.appendChild(buildMedia(direction));

    var content = document.createElement("div");
    content.className = "panel-content";

    var tagline = document.createElement("p");
    tagline.className = "panel-content__tagline";
    tagline.textContent = direction.tagline;
    content.appendChild(tagline);

    var body = document.createElement("div");
    body.className = "panel-content__body";
    langData.body.forEach(function (para) {
      var p = document.createElement("p");
      p.innerHTML = window.MK.i18n.renderInline(para);
      body.appendChild(p);
    });
    content.appendChild(body);

    if (direction.clients && direction.clients.length) {
      var clients = document.createElement("p");
      clients.className = "panel-content__clients";
      clients.textContent = direction.clients.join(" · ") + " · ";
      content.appendChild(clients);
    }

    var links = document.createElement("div");
    links.className = "panel-links";
    if (direction.links.website) links.appendChild(linkRow("website", direction.links.website));
    links.appendChild(linkRow("portfolio", direction.links.portfolio));
    links.appendChild(linkRow("collaboration", direction.links.collaboration));
    content.appendChild(links);

    grid.appendChild(content);
    wrap.appendChild(grid);
    return wrap;
  }

  function renderCard(direction, animate) {
    if (!animate) {
      cardEl.innerHTML = "";
      cardEl.appendChild(buildCardContent(direction));
      cardEl.classList.add("is-visible");
      return;
    }
    cardEl.classList.remove("is-visible");
    window.setTimeout(function () {
      cardEl.innerHTML = "";
      cardEl.appendChild(buildCardContent(direction));
      requestAnimationFrame(function () { cardEl.classList.add("is-visible"); });
    }, 180);
  }

  function setActive(id, animate) {
    if (id === activeId && animate !== false) return;
    activeId = id;
    navEl.querySelectorAll(".experience-typo-nav__item").forEach(function (btn) {
      var isActive = btn.getAttribute("data-id") === id;
      btn.classList.toggle("is-active", isActive);
      btn.setAttribute("aria-selected", String(isActive));
    });
    renderCard(getDirection(id), animate !== false);
  }

  function initBackground() {
    bgEl = document.getElementById("experiencePanelBgImage");
    bgEl.style.backgroundImage = "url('assets/images/backgrounds/experience-panel-bg.png')";
    requestAnimationFrame(function () { bgEl.classList.add("is-ready"); });
  }

  function init() {
    cardEl = document.getElementById("experiencePanelCard");
    renderStaticIntroBits();
    renderTypoNav();
    initBackground();
    setActive(activeId, false);

    document.addEventListener("mk:langchange", function () {
      renderCard(getDirection(activeId), false);
    });
  }

  window.MK = window.MK || {};
  window.MK.experience = { init: init };
})();

</script>
<script>
/* ==== js/method.js ==== */
/**
 * Interactive BRAND ECOSYSTEM DESIGN method list.
 * Desktop: hover activates a step, title + description turn accent, the
 * description fades out/in. Mobile: tap (same visual code, acts as an
 * accordion trigger).
 */
(function () {
  "use strict";

  var steps = window.SITE_CONTENT.brandEcosystem.method;
  var activeIndex = 0;
  var listEl;
  var isFinePointer = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  function renderDescription(row, step) {
    var lang = window.MK.i18n.getLang();
    var descEl = row.querySelector(".method__desc");
    descEl.innerHTML = '<span class="method__desc-inner">' + step[lang] + "</span>";
  }

  function setActive(index) {
    if (index === activeIndex) return;
    activeIndex = index;
    var rows = listEl.querySelectorAll(".method__row");
    rows.forEach(function (row, i) {
      var isActive = i === index;
      row.classList.toggle("is-active", isActive);
      row.setAttribute("aria-selected", String(isActive));
      if (isActive) renderDescription(row, steps[i]);
    });
  }

  function render() {
    listEl = document.getElementById("methodList");
    listEl.innerHTML = "";

    steps.forEach(function (step, i) {
      var row = document.createElement("div");
      row.className = "method__row" + (i === activeIndex ? " is-active" : "");
      row.setAttribute("role", "tab");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-selected", String(i === activeIndex));

      var titleWrap = document.createElement("div");
      titleWrap.className = "method__title-wrap";
      var marker = document.createElement("span");
      marker.className = "method__marker";
      marker.textContent = "×";
      var title = document.createElement("span");
      title.className = "method__title";
      title.textContent = step.title;
      titleWrap.appendChild(marker);
      titleWrap.appendChild(title);

      var desc = document.createElement("div");
      desc.className = "method__desc";

      row.appendChild(titleWrap);
      row.appendChild(desc);

      if (isFinePointer) {
        row.addEventListener("mouseenter", function () { setActive(i); });
      }
      row.addEventListener("click", function () { setActive(i); });
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActive(i); }
      });

      listEl.appendChild(row);
      if (i === activeIndex) renderDescription(row, step);
    });
  }

  document.addEventListener("mk:langchange", function () {
    var rows = listEl.querySelectorAll(".method__row");
    renderDescription(rows[activeIndex], steps[activeIndex]);
  });

  window.MK = window.MK || {};
  window.MK.method = { init: render };
})();

</script>
<script>
/* ==== js/work-together.js ==== */
/**
 * WAYS TO WORK TOGETHER — service columns + credentials.
 */
(function () {
  "use strict";

  function render() {
    var lang = window.MK.i18n.getLang();
    var data = window.SITE_CONTENT.workTogether;
    var wrap = document.getElementById("workCardBottom");
    wrap.innerHTML = "";

    data.services.forEach(function (service) {
      var col = document.createElement("div");
      col.className = "work-service";
      var title = document.createElement("p");
      title.className = "work-service__title";
      title.textContent = service.title;
      var text = document.createElement("p");
      text.className = "work-service__text";
      text.textContent = service[lang];
      col.appendChild(title);
      col.appendChild(text);
      wrap.appendChild(col);
    });

    var credWrap = document.createElement("div");
    credWrap.className = "work-credentials";
    data.credentials.forEach(function (c) {
      var line = document.createElement("p");
      line.innerHTML = "<strong>" + c.bold + "</strong> " + c.rest;
      credWrap.appendChild(line);
    });
    wrap.appendChild(credWrap);
  }

  document.addEventListener("mk:langchange", render);

  window.MK = window.MK || {};
  window.MK.workTogether = { init: render };
})();

</script>
<script>
/* ==== js/main.js ==== */
/**
 * App bootstrap.
 */
(function () {
  "use strict";

  function renderTriptych() {
    var wrap = document.getElementById("triptych");
    wrap.innerHTML = "";
    window.SITE_CONTENT.brandEcosystem.triptych.forEach(function (src) {
      var img = document.createElement("img");
      img.src = src;
      img.alt = "";
      img.loading = "lazy";
      wrap.appendChild(img);
    });
  }

  function renderFooterLinks() {
    var wrap = document.getElementById("footerLinks");
    wrap.innerHTML = "";
    window.SITE_CONTENT.footer.links.forEach(function (link) {
      var a = document.createElement("a");
      a.href = link.href;
      a.textContent = link.label;
      a.target = "_blank";
      a.rel = "noopener";
      wrap.appendChild(a);
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    window.MK.i18n.init();
    window.MK.nav.init();
    renderTriptych();
    renderFooterLinks();
    window.MK.method.init();
    window.MK.workTogether.init();
    window.MK.experience.init();
    window.MK.openingAnimation.play();
  });
})();

</script>
