<style>
/* ==== css/tokens.css ==== */
/* ==========================================================================
   Design tokens — colors, type scale, spacing, motion.
   Values are a professional responsive interpretation of the Keynote/PDF
   mockup: the mockup fixes proportion & hierarchy, not literal px sizes.
   ========================================================================== */

:root {
  /* Color system */
  --color-black: #0b0b0c;
  --color-white: #ffffff;
  --color-offwhite: #f4f1ea;      /* warm off-white — overlay cards */
  --color-pale-grey: #d6d6d6;     /* inactive typographic nav / backdrop type */
  --color-pale-grey-soft: #ececec;
  --color-accent: #7a81ff;
  --color-accent-dim: #5b62d9;

  --color-text: var(--color-black);
  --color-text-inverse: var(--color-white);
  --color-border: rgba(11, 11, 12, 0.12);
  --color-border-inverse: rgba(255, 255, 255, 0.18);

  /* Fonts */
  --font-display: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: Consolas, Monaco, "Courier New", monospace; /* direction-page functional links / buttons */

  /* Fluid type scale — clamp(min, preferred, max) */
  --fs-display-huge: clamp(4rem, 1rem + 19.5vw, 18.5rem);  /* RETAIL/BUSINESS/BRANDS/FILMS poster nav */
  --fs-display-xl: clamp(2.4rem, 1.75rem + 5.3vw, 6.6rem); /* hero I SEE / oversized direction words */
  --fs-display-lg: clamp(2.5rem, 1.6rem + 5vw, 6.5rem);    /* MARINA KAZAKOVA, panel titles */
  --fs-display-md: clamp(1.9rem, 1.3rem + 2.4vw, 3.2rem);  /* method titles */
  --fs-heading: clamp(1.7rem, 1.2rem + 1.6vw, 2.4rem);     /* Brand Ecosystem Design statement */
  --fs-body-lg: clamp(1.1rem, 1rem + 0.5vw, 1.45rem);      /* quote, tagline, method description, work grid */
  --fs-body: clamp(0.95rem, 0.9rem + 0.2vw, 1.05rem);      /* paragraphs */
  --fs-small: clamp(0.78rem, 0.75rem + 0.1vw, 0.875rem);   /* nav links */
  --fs-label: clamp(0.7rem, 0.68rem + 0.1vw, 0.8rem);      /* EXPERIENCE / BRAND ECOSYSTEM DESIGN / WAYS TO WORK TOGETHER */
  --fs-micro: 0.7rem;                                       /* year stamps etc */

  --lh-tight: 1.02;
  --lh-snug: 1.15;
  --lh-normal: 1.45;
  --lh-relaxed: 1.6;

  --ls-tight: -0.01em;
  --ls-normal: 0;
  --ls-wide: 0.08em;
  --ls-wider: 0.14em;
  --ls-label: 0.06em;

  /* Spacing */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2.25rem;
  --space-5: 3.5rem;
  --space-6: 5.5rem;
  --space-7: 8rem;

  --container-max: 1440px;
  --container-pad: clamp(1.25rem, 1rem + 2vw, 4rem);

  --radius-card: clamp(18px, 1.4vw, 28px);
  --radius-btn: 4px;

  --nav-height: 76px;

  /* Motion */
  --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 180ms;
  --dur-base: 320ms;
  --dur-slow: 600ms;
}

/* ==== css/base.css ==== */
/* ========================================================================
   Reset + base element styles
   ======================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  margin: 0;
  background: var(--color-white);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img {
  max-width: 100%;
  display: block;
}

h1, h2, h3, h4, p, figure {
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.container {
  width: 100%;
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--container-pad);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Shared label system: EXPERIENCE / BRAND ECOSYSTEM DESIGN™ / WAYS TO WORK TOGETHER */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  padding: 0.9em 2.1em;
  font-family: var(--font-body);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  border-radius: var(--radius-btn);
  transition: background var(--dur-base) var(--ease-editorial), color var(--dur-base) var(--ease-editorial), transform var(--dur-fast) var(--ease-editorial);
  white-space: nowrap;
}

.btn:active { transform: scale(0.97); }

.btn--dark {
  background: var(--color-black);
  color: var(--color-white);
}
.btn--dark:hover { background: var(--color-accent); color: var(--color-black); }

/* ==== css/nav.css ==== */
/* ========================================================================
   Top navigation — minimal, editorial, sticky on desktop
   ======================================================================== */

.site-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
  height: var(--nav-height);
  display: flex;
  align-items: center;
  background: transparent;
  backdrop-filter: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-base) var(--ease-editorial), background var(--dur-base) var(--ease-editorial), backdrop-filter var(--dur-base) var(--ease-editorial);
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity var(--dur-slow) var(--ease-editorial), transform var(--dur-slow) var(--ease-editorial);
  pointer-events: none;
}

.site-nav.is-visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.site-nav.is-scrolled {
  background: rgba(244, 241, 234, 0.72);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom-color: var(--color-border);
}

.site-nav__inner {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: var(--space-3);
}

.site-nav__mark {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  flex-shrink: 0;
  margin-right: auto;
}

/* ---- Opening title: MARINA KAZAKOVA appears large and centered, then
   flies/shrinks into the header mark's exact position (see
   js/opening-animation.js). Same font/weight/tracking as .site-nav__mark
   throughout — only size and position animate, for a seamless morph. */
body.is-opening { overflow: hidden; }

.opening-title {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 900;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.8rem, 1.2rem + 3vw, 3.8rem);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  color: var(--color-black);
  white-space: nowrap;
  opacity: 0;
  transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--s, 1));
  transition: opacity 350ms ease;
}

.opening-title.is-visible { opacity: 1; }

.opening-title.is-flying {
  transition: opacity 350ms ease, transform 600ms var(--ease-editorial);
}

.opening-title.is-done {
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
}

.site-nav__links {
  display: flex;
  align-items: center;
  gap: clamp(1rem, 1.5vw, 2.25rem);
}

.site-nav__link {
  font-size: var(--fs-small);
  font-weight: 600;
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  color: var(--color-text);
  opacity: 0.62;
  position: relative;
  padding-block: 0.35em;
  transition: opacity var(--dur-fast) var(--ease-editorial);
}

.site-nav__link::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: 0;
  height: 1px;
  background: var(--color-accent);
  transition: right var(--dur-base) var(--ease-editorial);
}

.site-nav__link:hover,
.site-nav__link.is-active {
  opacity: 1;
}
.site-nav__link:hover::after,
.site-nav__link.is-active::after {
  right: 0;
}

.site-nav__right {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.lang-switch {
  display: flex;
  align-items: center;
  gap: 0.4em;
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: var(--ls-wide);
}

.lang-switch__btn {
  opacity: 0.4;
  transition: opacity var(--dur-fast) var(--ease-editorial);
}
.lang-switch__btn.is-active { opacity: 1; }
.lang-switch__btn:hover { opacity: 0.8; }

.lang-switch__sep {
  opacity: 0.3;
}

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  width: 26px;
}
.nav-toggle span {
  display: block;
  height: 2px;
  background: var(--color-black);
  transition: transform var(--dur-base) var(--ease-editorial), opacity var(--dur-base) var(--ease-editorial);
}

@media (max-width: 760px) {
  .site-nav__links {
    position: fixed;
    top: var(--nav-height);
    left: 0;
    right: 0;
    background: var(--color-offwhite);
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
    padding: var(--space-3) var(--container-pad) var(--space-4);
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-base) var(--ease-editorial), transform var(--dur-base) var(--ease-editorial);
    border-bottom: 1px solid var(--color-border);
  }
  .site-nav__links.is-open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .nav-toggle { display: flex; }
  .nav-toggle.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.is-open span:nth-child(2) { opacity: 0; }
  .nav-toggle.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
}

/* ==== css/direction-page.css ==== */
/* ========================================================================
   DIRECTION PAGES — Retail / Business / Brands / Films
   Long-scroll editorial portfolio pages. One shared system (this file +
   js/direction-page.js + a per-direction data file) so Business/Brands/
   Films can reuse it once their content is ready.
   ======================================================================== */

.direction-page {
  padding-top: var(--nav-height);
}

/* ---- Intro: functional links (left) + title/tagline/text (right) ---- */
.direction-intro {
  display: grid;
  grid-template-columns: 0.7fr 1.3fr;
  gap: var(--space-6);
  padding-block: var(--space-6) var(--space-7);
}

.direction-intro__links {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  align-self: start;
  position: sticky;
  top: calc(var(--nav-height) + var(--space-4));
}

.direction-link {
  display: flex;
  align-items: center;
  gap: 0.6em;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  letter-spacing: var(--ls-normal);
  text-transform: uppercase;
  padding: 0.9em 1.1em;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-btn);
  transition: background var(--dur-fast) var(--ease-editorial), color var(--dur-fast) var(--ease-editorial), border-color var(--dur-fast) var(--ease-editorial);
}

.direction-link:hover {
  background: var(--color-black);
  color: var(--color-white);
  border-color: var(--color-black);
}

.direction-link.is-disabled {
  opacity: 0.35;
  pointer-events: none;
}

.direction-intro__back {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  opacity: 0.55;
  margin-bottom: var(--space-2);
  display: inline-block;
}
.direction-intro__back:hover { opacity: 1; }

.direction-intro__title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-display-lg);
  line-height: 0.95;
  letter-spacing: var(--ls-tight);
  text-transform: uppercase;
  margin-bottom: var(--space-3);
}

.direction-intro__tagline {
  font-weight: 700;
  font-size: var(--fs-body-lg);
  line-height: var(--lh-snug);
  margin-bottom: var(--space-3);
  max-width: 38rem;
}

.direction-intro__body {
  max-width: 42rem;
}
.direction-intro__body p {
  font-size: var(--fs-body-lg);
  line-height: var(--lh-relaxed);
  margin-bottom: 1em;
}
.direction-intro__body p:last-child { margin-bottom: 0; }

.direction-intro__clients {
  margin-top: var(--space-3);
  max-width: 42rem;
  font-weight: 700;
  font-size: var(--fs-body);
  line-height: var(--lh-relaxed);
}

/* ---- Portfolio flow ---- */
.portfolio-flow {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  padding-bottom: var(--space-7);
}

.pf-block { width: 100%; }

.pf-figure { position: relative; }
.pf-figure img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pf-caption {
  margin-top: 0.6em;
  font-size: var(--fs-small);
  color: var(--color-text);
  opacity: 0.6;
}

/* full-width single image */
.pf-full .pf-figure { aspect-ratio: 16 / 9; }
.pf-full.pf-hero .pf-figure { aspect-ratio: 16 / 10; }

/* two images side by side */
.pf-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
.pf-pair .pf-figure { aspect-ratio: 4 / 3; }

/* three images in a row */
.pf-trio {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
}
.pf-trio .pf-figure { aspect-ratio: 3 / 4; }

/* single vertical portrait, centered with generous surrounding space */
.pf-portrait {
  max-width: 34%;
  margin-inline: auto;
}
.pf-portrait .pf-figure { aspect-ratio: 3 / 4; }

/* small image, deliberately modest, offset rather than centered */
.pf-small {
  max-width: 30%;
}
.pf-small.is-end { margin-left: auto; }
.pf-small .pf-figure { aspect-ratio: 4 / 3; }

/* two images, unequal weight */
.pf-asymmetric {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: var(--space-3);
  align-items: end;
}
.pf-asymmetric .pf-figure { aspect-ratio: 4 / 3; }
.pf-asymmetric > :last-child .pf-figure { aspect-ratio: 3 / 4; }

/* video slot — same "clean until a source exists" approach as Films on the homepage */
.pf-video .pf-figure { aspect-ratio: 16 / 9; background: rgba(11, 11, 12, 0.045); }
.pf-video video, .pf-video iframe { width: 100%; height: 100%; border: 0; display: block; }

/* ---- Mid-page editorial CTA ---- */
.pf-cta {
  max-width: 34rem;
  margin-inline: auto;
  text-align: center;
  padding-block: var(--space-4);
}
.pf-cta__lead {
  font-size: var(--fs-heading);
  line-height: var(--lh-snug);
  margin-bottom: var(--space-3);
}
.pf-cta__sub {
  font-size: var(--fs-body-lg);
  opacity: 0.75;
  margin-bottom: var(--space-4);
}

/* ---- End of page ---- */
.direction-end {
  padding-block: var(--space-5) var(--space-6);
  text-align: center;
  border-top: 1px solid var(--color-border);
}
.direction-end__back {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: var(--ls-wide);
  transition: opacity var(--dur-fast) var(--ease-editorial);
}
.direction-end__back:hover { opacity: 0.6; }

@media (max-width: 900px) {
  .direction-intro { grid-template-columns: 1fr; gap: var(--space-4); }
  .direction-intro__links { position: static; flex-direction: row; flex-wrap: wrap; }
  .pf-pair, .pf-trio { grid-template-columns: 1fr; }
  .pf-asymmetric { grid-template-columns: 1fr; }
  .pf-portrait, .pf-small { max-width: 60%; }
}

</style>
</head>

<script>
/* ==== data/content.js ==== */
/**
 * Bilingual site content (EN / RU), sourced verbatim from "Тексты на сайт.docx".
 * Titles, taglines, credentials and CTA labels are kept in English in both
 * languages — this mirrors the client's own document, which keeps these
 * exact elements in English under both the RU and EN sections.
 *
 * Inline emphasis uses **double asterisks**; rendered as <strong> at runtime
 * (see js/i18n.js -> renderInline). Bold placement follows the source PDF
 * mockup (02_EXPERIENCE_PANELS.pdf), mirrored consistently across languages.
 */
window.SITE_CONTENT = {
  nav: {
    en: { profile: "Profile", experience: "Experience", method: "Method", work: "Work With Me" },
    ru: { profile: "Профиль", experience: "Опыт", method: "Метод", work: "Работа со мной" }
  },

  profile: {
    en: {
      headlineWords: [
        { w: "I", accent: true }, { w: "SEE", accent: true },
        { w: "WHAT", accent: false }, { w: "IT", accent: false },
        { w: "CAN", accent: true }, { w: "BECOME.", accent: true }
      ],
      name: "Marina Kazakova",
      roles: "Strategic Brand Advisor · Brand Strategist · Retail Experience Expert",
      bioBold: "22+ years in brand development, customer experience and business transformation.",
      bioText: "Working internationally with founders, companies and creative & cultural projects.",
      cta: "LET'S TALK"
    },
    ru: {
      headlineWords: [
        { w: "Я", accent: true }, { w: "ВИЖУ,", accent: true },
        { w: "ЧЕМ", accent: false }, { w: "ЭТО", accent: false },
        { w: "МОЖЕТ", accent: true }, { w: "СТАТЬ.", accent: true }
      ],
      name: "Марина Казакова",
      roles: "Strategic Brand Advisor · Brand Strategist · Retail Experience Expert",
      bioBold: "22+ лет в развитии брендов, клиентском опыте и трансформации бизнеса.",
      bioText: "Работаю на международном рынке с основателями, компаниями, креативными и культурными проектами.",
      cta: "LET'S TALK"
    }
  },

  experienceIntro: {

<script>
/* ==== js/i18n.js ==== */
/**
 * Minimal i18n layer. Default language: English.
 * Switching language only swaps text — structure, images, layout and
 * animations never change (per spec).
 */
(function () {
  "use strict";

  var state = { lang: "en" };

  function renderInline(str) {
    if (!str) return "";
    return String(str).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  /** Resolve a "a.b.c" path against SITE_CONTENT, trying the lang-keyed
   *  sub-object first, then falling back to a language-independent value. */
  function t(path) {
    var parts = path.split(".");
    var obj = window.SITE_CONTENT;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!obj) return "";
      obj = obj[parts[i]];
    }
    if (!obj) return "";
    var last = parts[parts.length - 1];
    if (obj[state.lang] && obj[state.lang][last] !== undefined) {
      return obj[state.lang][last];
    }
    return obj[last] !== undefined ? obj[last] : "";
  }

  function tNav(key) {
    return window.SITE_CONTENT.nav[state.lang][key];
  }

  function applyStatic() {
    document.documentElement.setAttribute("lang", state.lang);

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });

    document.querySelectorAll("[data-i18n-nav]").forEach(function (el) {
      el.textContent = tNav(el.getAttribute("data-i18n-nav"));
    });

    document.querySelectorAll(".lang-switch__btn").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.getAttribute("data-lang") === state.lang);
    });
  }

  function setLang(lang) {
    if (lang !== "en" && lang !== "ru") return;
    if (lang === state.lang) return;
    state.lang = lang;
    applyStatic();
    document.dispatchEvent(new CustomEvent("mk:langchange", { detail: { lang: lang } }));
  }

  function init() {
    document.querySelectorAll(".lang-switch__btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLang(btn.getAttribute("data-lang"));
      });
    });
    applyStatic();
  }

  window.MK = window.MK || {};
  window.MK.i18n = {
    init: init,
    setLang: setLang,
    t: t,
    renderInline: renderInline,
    getLang: function () { return state.lang; }
  };
})();

</script>
<script>
/* ==== js/nav.js ==== */
/**
 * Sticky navigation: scroll shadow, offset smooth-scroll, mobile toggle,
 * active-section highlighting.
 */
(function () {
  "use strict";

  var nav, toggle, links, sections;

  function onScroll() {
    nav.classList.toggle("is-scrolled", window.scrollY > 12);
  }

  function closeMobile() {
    links.classList.remove("is-open");
    toggle.classList.remove("is-open");
    toggle.setAttribute("aria-expanded", "false");
  }

  function initSmoothScroll() {
    nav.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener("click", function (e) {
        var target = document.querySelector(a.getAttribute("href"));
        if (!target) return;
        e.preventDefault();
        var navHeight = nav.offsetHeight;
        var top = target.getBoundingClientRect().top + window.pageYOffset - (navHeight - 1);
        window.scrollTo({ top: top, behavior: "smooth" });
        closeMobile();
      });
    });
  }

  function initActiveHighlight() {
    if (!("IntersectionObserver" in window)) return;
    var linkMap = {};
    links.querySelectorAll("a").forEach(function (a) {
      linkMap[a.getAttribute("href").replace("#", "")] = a;
    });

    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          var link = linkMap[entry.target.id];
          if (!link) return;
          if (entry.isIntersecting) {
            links.querySelectorAll("a").forEach(function (a) { a.classList.remove("is-active"); });
            link.classList.add("is-active");
          }
        });
      },
      { rootMargin: "-45% 0px -50% 0px" }
    );

    sections.forEach(function (s) { observer.observe(s); });
  }

  function reveal() {
    nav.classList.add("is-visible");
  }

  function init() {
    nav = document.getElementById("siteNav");
    toggle = document.getElementById("navToggle");
    links = document.getElementById("navLinks");
    sections = document.querySelectorAll("main > section[id]");

    window.addEventListener("scroll", onScroll, { passive: true });

    toggle.addEventListener("click", function () {
      var isOpen = links.classList.toggle("is-open");
      toggle.classList.toggle("is-open", isOpen);
      toggle.setAttribute("aria-expanded", String(isOpen));
    });

    initSmoothScroll();
    initActiveHighlight();
  }

  window.MK = window.MK || {};
  window.MK.nav = { init: init, reveal: reveal };
})();

</script>

    if (direction.links.website) linkRow("website", direction.links.website);
    linkRow("portfolio", direction.links.portfolio, "Check our projects");
    linkRow("collaboration", direction.links.collaboration, "Let's talk");
  }

  function figure(item) {
    var fig = document.createElement("div");
    fig.className = "pf-figure";
    var img = document.createElement("img");
    img.src = "" + item.src;
    img.alt = "";
    img.loading = "lazy";
    fig.appendChild(img);

    var wrap = document.createElement("div");
    wrap.appendChild(fig);
    if (item.caption) {
      var cap = document.createElement("p");
      cap.className = "pf-caption";
      cap.textContent = item.caption;
      wrap.appendChild(cap);
    }
    return wrap;
  }

  function renderCta() {
    var data = window.DIRECTION_PAGE_DATA.ctaText;
    var wrap = document.createElement("div");
    wrap.className = "pf-block pf-cta";

    var lead = document.createElement("p");
    lead.className = "pf-cta__lead";
    lead.textContent = data.lead;
    var sub = document.createElement("p");
    sub.className = "pf-cta__sub";
    sub.textContent = data.sub;
    var btn = document.createElement("a");
    btn.className = "btn btn--dark";
    btn.textContent = data.cta;
    btn.href = "https://t.me/marinakazakova_ru";
    btn.target = "_blank";
    btn.rel = "noopener";

    wrap.appendChild(lead);
    wrap.appendChild(sub);
    wrap.appendChild(btn);
    return wrap;
  }

  function renderBlock(block) {
    if (block.type === "cta") return renderCta();

    var wrap = document.createElement("div");
    wrap.className = "pf-block pf-" + block.type;
    if (block.hero) wrap.classList.add("pf-hero");
    if (block.end) wrap.classList.add("is-end");

    if (block.items) {
      block.items.forEach(function (item) { wrap.appendChild(figure(item)); });
    } else {
      wrap.appendChild(figure(block));
    }
    return wrap;
  }

  function renderFlow() {
    var wrap = document.getElementById("portfolioFlow");
    wrap.innerHTML = "";
    window.DIRECTION_PAGE_DATA.blocks.forEach(function (block) {
      wrap.appendChild(renderBlock(block));
    });
  }

  function render() {
    renderIntro(getDirection());
  }

  document.addEventListener("mk:langchange", render);

  document.addEventListener("DOMContentLoaded", function () {
    window.MK.i18n.init();
    window.MK.nav.init();
    document.getElementById("siteNav").classList.add("is-visible");
    render();
    renderFlow();
  });
})();

</script>
</body>
</html>
