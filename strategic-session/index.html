<body>

<!-- ============ NAVIGATION (links back to the homepage sections) ============ -->
<header class="site-nav" id="siteNav">
  <div class="container site-nav__inner">
    <a href="../index.html" class="site-nav__mark">Marina Kazakova</a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav__links" id="navLinks">
      <a class="site-nav__link" data-i18n-nav="profile" href="../index.html#profile">Profile</a>
      <a class="site-nav__link" data-i18n-nav="experience" href="../index.html#experience">Experience</a>
      <a class="site-nav__link" data-i18n-nav="method" href="../index.html#brand-ecosystem">Method</a>
      <a class="site-nav__link" data-i18n-nav="work" href="../index.html#work-together">Work With Me</a>
    </nav>

    <div class="site-nav__right">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button class="lang-switch__btn" data-lang="en">EN</button>
        <button class="lang-switch__btn" data-lang="ru">RU</button>
      </div>
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" aria-label="Music">
        <span class="music-toggle__icon" aria-hidden="true">♪</span>
      </button>
    </div>
  </div>
</header>

<main class="strategic-session">

  <!-- ============ 01 — HERO (screen 1) ============ -->
  <section class="ss-hero">
    <div class="container ss-hero__inner">
      <h1 class="ss-hero__title" id="ssTitle">STRATEGIC SESSION</h1>
      <p class="ss-hero__body" id="ssBody"></p>
      <a class="btn btn--dark ss-hero__cta" href="#strategic-brief">
        <span id="ssCtaLabel">START YOUR BRIEF</span><span class="ss-hero__cta-arrow" aria-hidden="true">↓</span>
      </a>
    </div>
  </section>

  <!-- ============ 02 — HOW IT WORKS ============ -->
  <section class="ss-how container">
    <p class="ss-label-pill" id="ssHowLabel">HOW IT WORKS</p>
    <div class="ss-how__stages" id="ssHowStages"></div>
  </section>

  <!-- ============ 03 — WHAT CAN COME OUT OF IT ============ -->
  <section class="ss-results">
    <div class="container">
      <p class="ss-label-pill" id="ssResultsLabel">WHAT CAN COME OUT OF IT</p>
      <h2 class="ss-results__title" id="ssResultsTitle">ONE SESSION. DIFFERENT RESULTS</h2>
      <div class="ss-results__columns" id="ssResultsColumns"></div>
    </div>
  </section>

  <!-- ============ 04 — MY APPROACH (temporary accent treatment) ============ -->
  <section class="ss-approach">
    <div class="container ss-approach__grid">
      <div class="ss-approach__media">
        <div class="ss-approach__result-plaque">
          <img id="ssApproachResultImage" src="../assets/images/strategic-session/session-result-example.png" alt="">
        </div>
        <div class="ss-approach__video-placeholder" aria-hidden="true">
          <div class="ss-approach__video-ui ss-approach__video-ui--top">
            <span class="ss-approach__video-time">0:12</span>
            <span class="ss-approach__video-cc">CC</span>
            <span class="ss-approach__video-speed">1x</span>
          </div>
          <span class="ss-approach__video-label">VIDEO</span>
          <div class="ss-approach__video-progress"><span></span></div>
        </div>
      </div>
      <div class="ss-approach__content reveal-up">
        <h2 class="ss-approach__title" id="ssApproachTitle">MY APPROACH TO THE SESSION</h2>
        <p class="ss-approach__text" id="ssApproachText"></p>
        <a class="ss-approach__transition" href="#strategic-brief"><span id="ssApproachTransitionLabel">YOUR TURN</span> ↓</a>
      </div>
    </div>
  </section>

  <!-- ============ 05 — STRATEGIC BRIEF (interactive module) ============ -->
  <section class="ss-brief" id="strategic-brief">
    <div class="container ss-brief__inner">
      <h2 class="ss-brief__title" id="ssBriefTitle">STRATEGIC BRIEF</h2>
      <p class="ss-brief__intro" id="ssBriefIntro"></p>
      <div class="ss-brief__progress" id="ssBriefProgress"></div>
      <div class="ss-brief__panel" id="ssBriefPanel"></div>
    </div>
  </section>

</main>

<!-- ============ FOOTER ============ -->

  </div>
</footer>
